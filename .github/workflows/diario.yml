name: Observatorio diario

on:
  schedule:
    # 07:30 UTC de lunes a sábado (el BOE se publica de lunes a sábado a primera hora)
    - cron: "30 7 * * 1-6"
  push:
    paths:
      - "data/fuentes/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatorio
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar observatorio (últimos 4 días)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m observatorio.cli run --days 4

      - name: Seguimiento de resoluciones (últimos 20 días hábiles)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m observatorio.cli resoluciones --days 20

      - name: Vertical del litoral (últimos 8 días)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m observatorio.cli litoral --days 8

      - name: Publicar cambios (estado, caché y web)
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Actualización automática $(date -u +%Y-%m-%d)"
            git push
          fi
